name: publish-production
on:
  push:
    branches: ["main"]
    # Workflow and docs merges have nothing to publish
    paths-ignore: [".github/**", ".eas/**", "docs/**", "**.md"]
  workflow_dispatch:

# Merges publish in order, a queued run waits for the one before it
concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # eas-cli 23.x requires Node >= 22.
          node-version: 22.x
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish production update
        # The commit message comes in through env so its text can't run as shell
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="${MESSAGE:-$GITHUB_SHA}"
          eas update --channel production --environment production --non-interactive --message "Production update: ${MESSAGE:0:1000}"
